<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inicio · Centro Ibero Meneses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilo_menu.css">
</head>
<body>

  <div class="bg-shape"></div>

  <header>
    <img src="assets/logo.png" alt="Centro Ibero Meneses">
    <div class="header-right">
      <div class="user-chip">
        <div class="avatar">LG</div>
        <span>Leo González</span>
      </div>
      <button class="logout-btn" title="Cerrar sesión" aria-label="Cerrar sesión" onclick="window.location.href='login.html'">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <path d="M16 17l5-5-5-5"/>
          <path d="M21 12H9"/>
        </svg>
      </button>
    </div>
  </header>

  <main>
    <p class="eyebrow">Centro Ibero Meneses</p>
    <h1>¿Qué necesitas hacer hoy?</h1>

    <button class="primary-action" onclick="window.location.href='sistema_centro.html'">
      <div class="icon-frame">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1.5"/>
          <rect x="14" y="3" width="7" height="7" rx="1.5"/>
          <rect x="3" y="14" width="7" height="7" rx="1.5"/>
          <rect x="14" y="14" width="7" height="7" rx="1.5"/>
        </svg>
      </div>
      <div class="txt">
        <strong>Sistema</strong>
        <p>Personas, proyectos, talleres, casos y colonias</p>
      </div>
      <svg class="arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14"/><path d="M13 6l6 6-6 6"/>
      </svg>
    </button>

    <p class="divider-label">Accesos rápidos</p>

    <div class="quick-grid">
      <button class="quick-card">
        <div class="icon-frame">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 11l3 3L22 4"/>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
          </svg>
        </div>
        <span>Reporte de avance<br>de proyecto</span>
      </button>

      <button class="quick-card">
        <div class="icon-frame">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2 2 21h20L12 2Z"/>
            <path d="M12 9v5"/><path d="M12 17h.01"/>
          </svg>
        </div>
        <span>Reporte de problemáticas<br>en territorio</span>
      </button>

      <button class="quick-card">
        <div class="icon-frame">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 3v18h18"/>
            <rect x="7" y="12" width="3" height="6" rx="0.5"/>
            <rect x="12.5" y="8" width="3" height="10" rx="0.5"/>
            <rect x="18" y="5" width="3" height="13" rx="0.5"/>
          </svg>
        </div>
        <span>Análisis</span>
      </button>
    </div>
  </main>

</body>
</html>
