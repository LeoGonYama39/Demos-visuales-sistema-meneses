<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inicio · Centro Ibero Meneses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --font-main: 'Poppins', -apple-system, sans-serif; /* <- cambia la tipografía aquí */

    --ink: #17130f;
    --graphite: #4a453f;
    --steel: #82786f;
    --mist: #ded9d3;
    --mist-soft: #f1efec;
    --pearl: #faf9f7;
    --white: #ffffff;

    --accent: #E00034;
    --accent-dark: #A8002A;
    --accent-light: #ff3d64;
    --accent-soft: #fce6ea;

    --radius-lg: 20px;
    --radius-md: 16px;
    --radius-sm: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-main);
    background: var(--pearl);
    min-height: 100vh;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 28px 48px;
  }

  header img { height: 34px; }

  .header-right { display: flex; align-items: center; gap: 12px; }

  .user-chip {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--white);
    border: 1.5px solid var(--mist);
    border-radius: 999px;
    padding: 7px 16px 7px 7px;
  }

  .user-chip .avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--white);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12.5px;
    font-weight: 700;
  }

  .user-chip span { font-size: 13.5px; font-weight: 600; color: var(--graphite); }

  .logout-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--white);
    border: 1.5px solid var(--mist);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
    flex-shrink: 0;
  }
  .logout-btn svg { stroke: var(--steel); transition: stroke 0.15s ease; }
  .logout-btn:hover { border-color: var(--accent-dark); background: var(--accent-dark); }
  .logout-btn:hover svg { stroke: var(--white); }

  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 24px 80px;
    text-align: center;
  }

  .eyebrow {
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  h1 {
    font-size: 32px;
    font-weight: 800;
    color: var(--ink);
    letter-spacing: -0.02em;
    margin-bottom: 44px;
  }

  /* --- Botón principal: Sistema --- */
  .primary-action {
    position: relative;
    display: flex;
    align-items: center;
    gap: 24px;
    text-align: left;
    background: var(--accent);
    background-image: radial-gradient(circle at 90% 120%, var(--accent-light) 0%, transparent 55%);
    color: var(--white);
    border: none;
    border-radius: var(--radius-lg);
    padding: 34px 38px;
    width: 100%;
    cursor: pointer;
    margin-bottom: 40px;
    overflow: hidden;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 18px 40px rgba(224,0,52,0.28);
  }

  .primary-action:hover {
    transform: translateY(-2px);
    box-shadow: 0 22px 48px rgba(224,0,52,0.36);
  }

  .primary-action .icon-chip {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: rgba(255,255,255,0.16);
    border: 1.5px solid rgba(255,255,255,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .primary-action .icon-chip svg { stroke: var(--white); }

  .primary-action .txt strong {
    display: block;
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .primary-action .txt p {
    font-size: 13.5px;
    color: rgba(255,255,255,0.85);
    font-weight: 500;
  }

  .primary-action .arrow {
    margin-left: auto;
    stroke: var(--white);
    flex-shrink: 0;
  }

  .divider-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--steel);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  /* --- Accesos rápidos --- */
  .quick-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
  }

  .quick-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 14px;
    background: var(--white);
    border: 1.5px solid var(--mist);
    border-radius: var(--radius-md);
    padding: 28px 20px;
    cursor: pointer;
    transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .quick-card:hover {
    transform: translateY(-3px);
    border-color: var(--accent);
    box-shadow: 0 14px 30px rgba(224,0,52,0.14);
  }

  .icon-chip {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--accent-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .icon-chip svg { stroke: var(--accent); }

  .quick-card span {
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.3;
  }

  @media (max-width: 720px) {
    .quick-grid { grid-template-columns: 1fr; }
    header { padding: 20px 24px; }
    main { padding: 32px 20px 60px; }
    h1 { font-size: 24px; }
    .primary-action { flex-wrap: wrap; }
  }
</style>
</head>
<body>

  <header>
    <img src="assets/logo.png" alt="Centro Ibero Meneses">
    <div class="header-right">
      <div class="user-chip">
        <div class="avatar">LG</div>
        <span>Leo González</span>
      </div>
      <button class="logout-btn" title="Cerrar sesión" aria-label="Cerrar sesión">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <path d="M16 17l5-5-5-5"/>
          <path d="M21 12H9"/>
        </svg>
      </button>
    </div>
  </header>

  <main>
    <p class="eyebrow">Centro Ibero Meneses</p>
    <h1>¿Qué necesitas hacer hoy?</h1>

    <button class="primary-action">
      <div class="icon-chip">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1.5"/>
          <rect x="14" y="3" width="7" height="7" rx="1.5"/>
          <rect x="3" y="14" width="7" height="7" rx="1.5"/>
          <rect x="14" y="14" width="7" height="7" rx="1.5"/>
        </svg>
      </div>
      <div class="txt">
        <strong>Sistema</strong>
        <p>Personas, proyectos, talleres, casos y colonias</p>
      </div>
      <svg class="arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14"/><path d="M13 6l6 6-6 6"/>
      </svg>
    </button>

    <p class="divider-label">Accesos rápidos</p>

    <div class="quick-grid">
      <button class="quick-card">
        <div class="icon-chip">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 11l3 3L22 4"/>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
          </svg>
        </div>
        <span>Reporte de avance<br>de proyecto</span>
      </button>

      <button class="quick-card">
        <div class="icon-chip">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2 2 21h20L12 2Z"/>
            <path d="M12 9v5"/><path d="M12 17h.01"/>
          </svg>
        </div>
        <span>Reporte de problemáticas<br>en territorio</span>
      </button>

      <button class="quick-card">
        <div class="icon-chip">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 3v18h18"/>
            <rect x="7" y="12" width="3" height="6" rx="0.5"/>
            <rect x="12.5" y="8" width="3" height="10" rx="0.5"/>
            <rect x="18" y="5" width="3" height="13" rx="0.5"/>
          </svg>
        </div>
        <span>Análisis</span>
      </button>
    </div>
  </main>

</body>
</html>
