<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión · Centro Ibero Meneses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --font-main: 'Poppins', -apple-system, sans-serif; /* <- cambia la tipografía aquí */

    --ink: #17130f;
    --graphite: #4a453f;
    --steel: #82786f;
    --mist: #ded9d3;
    --mist-soft: #f1efec;
    --pearl: #faf9f7;
    --white: #ffffff;

    --accent: #E00034;
    --accent-dark: #A8002A;
    --accent-light: #ff3d64;

    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    font-family: var(--font-main);
    display: flex;
    min-height: 100vh;
  }

  /* ============ PANEL DE MARCA ============ */
  .brand-panel {
    flex: 1 1 44%;
    position: relative;
    background: var(--accent);
    background-image: radial-gradient(circle at 20% 15%, var(--accent-light) 0%, transparent 45%),
                       radial-gradient(circle at 85% 90%, var(--accent-dark) 0%, transparent 55%);
    color: var(--white);
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 64px;
    overflow: hidden;
  }

  .brand-mark {
    width: 64px;
    height: 64px;
    border: 3px solid rgba(255,255,255,0.9);
    border-radius: 34%;
    transform: rotate(45deg);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 40px;
  }
  .brand-mark::after {
    content: "";
    width: 26px;
    height: 26px;
    background: var(--white);
    border-radius: 34%;
  }

  .brand-panel .eyebrow {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.75);
    margin-bottom: 14px;
  }

  .brand-panel h1 {
    font-size: 42px;
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -0.01em;
    margin-bottom: 20px;
  }

  .brand-panel p {
    font-size: 15px;
    font-weight: 500;
    color: rgba(255,255,255,0.85);
    max-width: 340px;
    line-height: 1.6;
  }

  .brand-decor {
    position: absolute;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.18);
  }
  .brand-decor.d1 { width: 420px; height: 420px; top: -140px; right: -160px; }
  .brand-decor.d2 { width: 220px; height: 220px; bottom: -100px; left: -60px; border-color: rgba(255,255,255,0.12); }

  /* ============ PANEL DE FORMULARIO ============ */
  .form-panel {
    flex: 1 1 56%;
    background: var(--white);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
  }

  .form-wrap { width: 100%; max-width: 360px; }

  .logo-wrap { margin-bottom: 40px; }
  .logo-wrap img { height: 38px; }

  .form-wrap h2 {
    font-size: 24px;
    font-weight: 800;
    color: var(--ink);
    letter-spacing: -0.01em;
    margin-bottom: 6px;
  }

  .form-wrap .subtitle {
    font-size: 13.5px;
    color: var(--steel);
    font-weight: 500;
    margin-bottom: 32px;
  }

  form { display: flex; flex-direction: column; gap: 18px; }

  .field label {
    display: block;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--graphite);
    margin-bottom: 7px;
  }

  .input-shell {
    display: flex;
    align-items: center;
    background: var(--pearl);
    border: 1.5px solid var(--mist);
    border-radius: var(--radius-sm);
    padding: 0 14px;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .input-shell:focus-within {
    border-color: var(--accent);
    background: var(--white);
  }
  .input-shell svg { flex-shrink: 0; stroke: var(--steel); transition: stroke 0.15s ease; }
  .input-shell:focus-within svg { stroke: var(--accent); }
  .input-shell input {
    border: none;
    background: transparent;
    outline: none;
    font-family: var(--font-main);
    font-size: 14.5px;
    color: var(--ink);
    padding: 13px 10px;
    width: 100%;
  }
  .input-shell input::placeholder { color: #b4aca3; }

  .toggle-pass {
    background: none;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    padding: 4px;
    flex-shrink: 0;
  }
  .toggle-pass svg { stroke: var(--steel); }
  .toggle-pass:hover svg { stroke: var(--accent); }

  .remember-row { display: flex; align-items: center; gap: 9px; margin-top: -4px; }

  .remember-row input[type="checkbox"] {
    appearance: none;
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border: 1.5px solid var(--mist);
    border-radius: 6px;
    background: var(--pearl);
    cursor: pointer;
    flex-shrink: 0;
    position: relative;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .remember-row input[type="checkbox"]:checked {
    background: var(--accent);
    border-color: var(--accent);
  }
  .remember-row input[type="checkbox"]:checked::after {
    content: "";
    position: absolute;
    left: 5.5px;
    top: 1.5px;
    width: 4px;
    height: 9px;
    border: solid var(--white);
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }
  .remember-row label {
    font-size: 13px;
    font-weight: 600;
    color: var(--graphite);
    cursor: pointer;
    user-select: none;
  }

  .btn-login {
    margin-top: 8px;
    background: var(--accent);
    color: var(--white);
    border: none;
    border-radius: var(--radius-sm);
    padding: 15px;
    font-family: var(--font-main);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.01em;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
    box-shadow: 0 12px 28px rgba(224,0,52,0.28);
  }
  .btn-login:hover { background: var(--accent-dark); box-shadow: 0 14px 32px rgba(224,0,52,0.36); }
  .btn-login:active { transform: scale(0.98); }

  .foot-note {
    text-align: left;
    font-size: 12px;
    color: var(--steel);
    margin-top: 28px;
    font-weight: 600;
  }

  @media (max-width: 860px) {
    body { flex-direction: column; }
    .brand-panel { flex: none; padding: 40px 32px; min-height: 200px; justify-content: center; }
    .brand-panel h1 { font-size: 28px; }
    .brand-panel p { display: none; }
    .brand-mark { width: 46px; height: 46px; margin-bottom: 18px; }
    .brand-decor.d1 { width: 260px; height: 260px; top: -120px; right: -100px; }
    .brand-decor.d2 { display: none; }
    .form-panel { flex: none; padding: 40px 28px; }
  }
</style>
</head>
<body>

  <div class="brand-panel">
    <div class="brand-decor d1"></div>
    <div class="brand-decor d2"></div>
    <div class="brand-mark"></div>
    <p class="eyebrow">Centro Ibero Meneses</p>
    <h1>Sistema de gestión</h1>
  </div>

  <div class="form-panel">
    <div class="form-wrap">
      <div class="logo-wrap">
        <img src="assets/logo.png" alt="Centro Ibero Meneses">
      </div>

      <h2>Bienvenido de nuevo</h2>
      <p class="subtitle">Ingresa tus datos para continuar</p>

      <form onsubmit="return false;">
        <div class="field">
          <label for="usuario">Usuario</label>
          <div class="input-shell">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <input id="usuario" type="text" placeholder="Ususario">
          </div>
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <div class="input-shell">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="10.5" width="16" height="10" rx="2.5"/>
              <path d="M7.5 10.5V7a4.5 4.5 0 0 1 9 0v3.5"/>
            </svg>
            <input id="password" type="password" placeholder="Contraseña">
            <button type="button" class="toggle-pass" onclick="togglePassword()" aria-label="Mostrar contraseña">
              <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="remember-row">
          <input type="checkbox" id="recordar">
          <label for="recordar">Mantener sesión iniciada</label>
        </div>

        <button type="submit" class="btn-login">Ingresar</button>
      </form>

      <p class="foot-note">Centro Ibero Meneses</p>
    </div>
  </div>

<script>
  let visible = false;
  function togglePassword() {
    visible = !visible;
    const input = document.getElementById('password');
    const icon = document.getElementById('eye-icon');
    input.type = visible ? 'text' : 'password';
    icon.innerHTML = visible
      ? '<path d="M3 3l18 18"/><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.5 5.3A9.8 9.8 0 0 1 12 5c6.5 0 10 7 10 7a15.6 15.6 0 0 1-3.4 4.4M6.6 6.6C4 8.3 2 12 2 12s3.5 7 10 7a9.7 9.7 0 0 0 4-.8"/>'
      : '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>';
  }
</script>

</body>
</html>
