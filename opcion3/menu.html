<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inicio · Centro Ibero Meneses</title>
<style>
  :root {
    --font-main: "Segoe UI", Tahoma, Geneva, Verdana, Arial, sans-serif;

    --navy: #1F4E78;
    --navy-dark: #163A58;
    --navy-darker: #0F2A40;

    --ink: #1a1a1a;
    --text-secondary: #4a4a4a;
    --border: #9AA5B1;
    --border-strong: #6b7580;
    --bg: #E8EBEE;
    --field-bg: #ffffff;
    --white: #ffffff;

    --radius: 2px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-main);
    background: var(--bg);
    min-height: 100vh;
  }

  /* ============ BARRA SUPERIOR ============ */
  header {
    background: var(--navy);
    border-bottom: 3px solid var(--navy-darker);
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 32px;
  }

  header .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  header .brand img {
    height: 28px;
    width: auto;
    filter: brightness(0) invert(1);
  }

  header .brand .title-block { line-height: 1.25; }

  header .brand .title-block strong {
    display: block;
    color: var(--white);
    font-size: 14px;
    font-weight: 700;
  }

  header .brand .title-block span {
    display: block;
    color: #c7d4de;
    font-size: 11px;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .user-chip {
    display: flex;
    align-items: center;
    gap: 9px;
    background: var(--navy-dark);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: var(--radius);
    padding: 6px 14px 6px 6px;
  }

  .user-chip .avatar {
    width: 26px;
    height: 26px;
    border-radius: var(--radius);
    background: var(--white);
    color: var(--navy);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    flex-shrink: 0;
  }

  .user-chip span {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--white);
  }

  .logout-btn {
    width: 34px;
    height: 34px;
    border-radius: var(--radius);
    background: var(--navy-dark);
    border: 1px solid rgba(255,255,255,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.1s ease;
    flex-shrink: 0;
  }

  .logout-btn svg { stroke: #c7d4de; }
  .logout-btn:hover { background: var(--navy-darker); }
  .logout-btn:hover svg { stroke: var(--white); }

  /* ============ CONTENIDO ============ */
  main {
    max-width: 860px;
    margin: 0 auto;
    padding: 40px 24px 70px;
  }

  .eyebrow {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--text-secondary);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  h1 {
    font-size: 22px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 28px;
  }

  /* --- Panel principal: Sistema --- */
  .primary-action {
    display: flex;
    align-items: center;
    gap: 20px;
    text-align: left;
    background: var(--navy);
    color: var(--white);
    border: 1px solid var(--navy-darker);
    border-radius: var(--radius);
    padding: 22px 26px;
    width: 100%;
    cursor: pointer;
    margin-bottom: 32px;
    transition: background 0.1s ease;
  }

  .primary-action:hover { background: var(--navy-dark); }

  .primary-action .icon-frame {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.35);
  }

  .primary-action .icon-frame svg { stroke: var(--white); }

  .primary-action .txt strong {
    display: block;
    font-size: 16.5px;
    font-weight: 700;
    margin-bottom: 3px;
  }

  .primary-action .txt p {
    font-size: 12.5px;
    color: #c7d4de;
    font-weight: 400;
  }

  .primary-action .arrow {
    margin-left: auto;
    stroke: var(--white);
    flex-shrink: 0;
  }

  .divider-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-secondary);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  /* --- Accesos rápidos --- */
  .quick-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }

  .quick-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 12px;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 16px;
    cursor: pointer;
    transition: border-color 0.1s ease, background 0.1s ease;
  }

  .quick-card:hover {
    border-color: var(--navy);
    background: #F2F4F6;
  }

  .icon-frame {
    width: 44px;
    height: 44px;
    border-radius: var(--radius);
    background: var(--bg);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .icon-frame svg { stroke: var(--navy); }

  .quick-card span {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.3;
  }

  @media (max-width: 720px) {
    .quick-grid { grid-template-columns: 1fr; }
    header { padding: 12px 20px; flex-wrap: wrap; gap: 10px; }
    main { padding: 28px 18px 50px; }
    h1 { font-size: 19px; }
    .primary-action { flex-wrap: wrap; }
  }
</style>
</head>
<body>

  <header>
    <div class="brand">
      <img src="assets/logo.png" alt="Centro Ibero Meneses">
      <div class="title-block">
        <strong>Centro Ibero Meneses</strong>
        <span>Sistema de gestión de información</span>
      </div>
    </div>
    <div class="header-right">
      <div class="user-chip">
        <div class="avatar">LG</div>
        <span>Leo González</span>
      </div>
      <button class="logout-btn" title="Cerrar sesión" aria-label="Cerrar sesión">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <path d="M16 17l5-5-5-5"/>
          <path d="M21 12H9"/>
        </svg>
      </button>
    </div>
  </header>

  <main>
    <p class="eyebrow">Centro Ibero Meneses</p>
    <h1>¿Qué necesitas hacer hoy?</h1>

    <button class="primary-action">
      <div class="icon-frame">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
      </div>
      <div class="txt">
        <strong>Sistema</strong>
        <p>Personas, proyectos, talleres, casos y colonias</p>
      </div>
      <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14"/><path d="M13 6l6 6-6 6"/>
      </svg>
    </button>

    <p class="divider-label">Accesos rápidos</p>

    <div class="quick-grid">
      <button class="quick-card">
        <div class="icon-frame">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 11l3 3L22 4"/>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
          </svg>
        </div>
        <span>Reporte de avance<br>de proyecto</span>
      </button>

      <button class="quick-card">
        <div class="icon-frame">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2 2 21h20L12 2Z"/>
            <path d="M12 9v5"/><path d="M12 17h.01"/>
          </svg>
        </div>
        <span>Reporte de problemáticas<br>en territorio</span>
      </button>

      <button class="quick-card">
        <div class="icon-frame">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 3v18h18"/>
            <rect x="7" y="12" width="3" height="6" rx="0.5"/>
            <rect x="12.5" y="8" width="3" height="10" rx="0.5"/>
            <rect x="18" y="5" width="3" height="13" rx="0.5"/>
          </svg>
        </div>
        <span>Análisis</span>
      </button>
    </div>
  </main>

</body>
</html>
